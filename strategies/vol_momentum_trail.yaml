name: vol_momentum_trail
family: trend_following
timeframe: H1
rationale: 'vol_momentum entries with a trailing stop instead of waiting for the opposite
  crossover: the stop starts 3 ATR away and, once the trade is 1R in profit, follows
  the best price 2.5 ATR behind. A template for trailing exits; not validated.'
filters:
- op: gt
  args:
  - adx_14
  - $adx_min
entry_long:
  op: and
  args:
  - op: gt
    args:
    - ema_$fast
    - ema_$slow
  - op: gt
    args:
    - close
    - donchian_high_$dc
entry_short: mirror
exit:
  stop:
    atr_mult: $stop_atr
    atr_n: 14
  target: null
  exit_long:
    op: lt
    args:
    - ema_$fast
    - ema_$slow
  exit_short: mirror
  max_bars: 400
  trail:
    atr_mult: 2.5
    atr_n: 14
    activate_r: 1.0
sizing:
  type: vol_target
  annual_vol: 0.1
  equity: 10000
  max_lots: 2.0
params:
  fast: 20
  slow: 50
  dc: 20
  adx_min: 20
  stop_atr: 3.0
params_space:
  fast:
  - 10
  - 30
  - 5
  slow:
  - 40
  - 100
  - 10
  dc:
  - 10
  - 40
  - 10
  adx_min:
  - 15
  - 30
  - 5
  stop_atr:
  - 2.0
  - 4.0
  - 0.5
